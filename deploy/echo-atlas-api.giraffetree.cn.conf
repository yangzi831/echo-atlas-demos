limit_req_zone $binary_remote_addr zone=echo_atlas_api_requests:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=echo_atlas_api_connections:1m;
server {
    listen 80;
    listen [::]:80;
    server_name echo-atlas-api.giraffetree.cn;
    access_log off;
    return 301 https://echo-atlas-api.giraffetree.cn$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echo-atlas-api.giraffetree.cn;
    ssl_certificate /etc/nginx/ssl/giraffetree.cn.cer;
    ssl_certificate_key /etc/nginx/ssl/giraffetree.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64k;
    client_body_buffer_size 128k;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=echo_atlas_api_requests burst=20 nodelay;
        limit_conn echo_atlas_api_connections 8;
        proxy_pass http://127.0.0.1:3198;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
