<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SecondEar 实机接收测试</title><style>body{background:#102024;color:#deeeee;font:18px system-ui;margin:40px}button{font:inherit;padding:15px}pre{white-space:pre-wrap}textarea{width:100%;height:350px}</style><h1>SecondEar 实机接收测试</h1><p>使用当前未提交的实时接收代码。持续 120 秒，写入本机 IndexedDB，不上传音频。</p><button id="start">连接设备并测试 120 秒</button> <button id="stop" disabled>停止测试</button><p id="status">等待设备</p><pre id="stats"></pre><textarea id="result" aria-label="测试结果" readonly></textarea>
<script type="module">
import {EarLink} from '/src/services/secondEar/bluetooth.js';
const $=id=>document.getElementById(id);let link,timer,startAt,db,interval,metrics;
const open=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('echo-atlas-hardware-test',1);r.onupgradeneeded=()=>r.result.createObjectStore('chunks');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function show(){const wall=startAt?(performance.now()-startAt)/1000:0;$('stats').textContent=JSON.stringify({...metrics,wallSeconds:+wall.toFixed(2)},null,2);}
$('start').onclick=async()=>{metrics={receivedSamples:0,gapSamples:0,savedSamples:0,committedSegments:0,resendCommands:0,maxSaveMs:0,maxAckMs:0,ackFrame:0,errors:[]};$('start').disabled=true;
 try{db=await open();link=new EarLink({state:s=>{$('status').textContent=s;},status:(message,failed)=>{$('status').textContent=message;if(failed)metrics.errors.push(message);},progress:()=>{},liveStart:m=>{metrics.initial=m;startAt=performance.now();timer=setTimeout(()=>link.stopLive(),120000);$('stop').disabled=false;},liveFrame:(pcm,info)=>{metrics.receivedSamples+=pcm.length/2;if(info?.gap)metrics.gapSamples+=pcm.length/2;},save:async(blob,info)=>{const now=performance.now();await new Promise((resolve,reject)=>{const tx=db.transaction('chunks','readwrite');tx.objectStore('chunks').put(blob,`${info?.session}:${info?.offset}`);tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(tx.error);});metrics.maxSaveMs=Math.max(metrics.maxSaveMs,Math.round(performance.now()-now));metrics.savedSamples+=(blob.size-44)/2;metrics.committedSegments++;},liveEnd:async(m,failed)=>{clearTimeout(timer);clearInterval(interval);metrics.final=m;metrics.failed=failed;metrics.wallSeconds=+( (performance.now()-startAt)/1000).toFixed(2);metrics.sampleCountMatches=m.samples-(metrics.initial.acked||0)*320===metrics.receivedSamples;metrics.allReceivedSaved=metrics.savedSamples===metrics.receivedSamples;$('result').value=JSON.stringify(metrics,null,2);$('stop').disabled=true;setTimeout(()=>{link.disconnect();db.close();show();},50);}});
 const operation=link.operation.bind(link);link.operation=async(op,m,offset=0)=>{const at=performance.now();await operation(op,m,offset);if(op===8)metrics.resendCommands++;if(op===7){metrics.ackFrame=offset;metrics.maxAckMs=Math.max(metrics.maxAckMs,Math.round(performance.now()-at));}};
 link.auto=false;link.startLive();await link.choose();interval=setInterval(show,500);
 }catch(e){metrics.errors.push(e.message);$('result').value=JSON.stringify(metrics,null,2);$('start').disabled=false;}
};$('stop').onclick=()=>{clearTimeout(timer);link?.stopLive();};
</script></html>
